<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crownllion – the daily dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--sky:#1b7f9a;--mid:#0b3452;--deep:#06182a;--abyss:#030b14;--ink:#e8f4f8;--mute:#8fb0c0;--line:rgba(143,176,192,.22);--gold:#f5c84b;--aqua:#5ee0d0;--krill:#ff8a6a;--bad:#ff6b7a}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0,var(--mid) 18%,var(--deep) 55%,var(--abyss) 100%) fixed;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.logo span{color:var(--krill)}
.who{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--mute)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 14px;color:var(--ink)}
.ghost:hover{border-color:var(--aqua)}
.stage{display:grid;grid-template-columns:84px 1fr;gap:24px;align-items:stretch}
@media(max-width:560px){.stage{grid-template-columns:56px 1fr;gap:12px}}
/* depth gauge */
.gauge{position:relative;min-height:440px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(94,224,208,.35),rgba(6,24,42,.2) 40%,rgba(3,11,20,.7));overflow:hidden}
.gauge i{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.gauge i b{position:absolute;left:50%;transform:translateX(-50%);top:3px;font:600 .65rem/1 inherit;color:var(--mute);font-style:normal}
#diver{position:absolute;left:50%;top:2%;font-size:1.7rem;transform:translateX(-50%);transition:top 1.1s cubic-bezier(.2,.8,.3,1.1);filter:drop-shadow(0 0 10px rgba(255,138,106,.6))}
.depth{margin-top:8px;text-align:center;font-weight:800;font-size:1.05rem}
.depth small{display:block;color:var(--mute);font-weight:400;font-size:.75rem}
/* card */
.card{border:1px solid var(--line);border-radius:24px;padding:28px;background:rgba(3,11,20,.55);backdrop-filter:blur(8px);min-height:440px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.9rem}
.dots{display:flex;gap:6px}
.dots u{width:22px;height:6px;border-radius:3px;background:var(--line);text-decoration:none}
.dots u.on{background:var(--aqua)}
.dots u.done{background:var(--krill)}
.air{height:6px;border-radius:3px;background:var(--line);margin:14px 0 30px;overflow:hidden}
.air div{height:100%;width:100%;background:var(--aqua);transition:width 1s linear,background .3s}
.air.low div{background:var(--bad)}
.q{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin-bottom:26px}
.q small{display:block;font-size:.95rem;font-weight:400;color:var(--mute);letter-spacing:0;margin-bottom:8px}
form.g{display:flex;gap:10px;margin-top:auto}
.g input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:1.1rem}
.g input:focus{border-color:var(--aqua);outline:none}
.go{background:var(--krill);color:#2a0d05;border:0;border-radius:16px;padding:0 24px;font-weight:800}
.go:disabled,.g input:disabled{opacity:.5;cursor:not-allowed}
.reveal{min-height:72px;margin-top:18px;font-size:1.05rem}
.reveal .t{font-weight:800;font-size:1.5rem}
.reveal.t100 .t{color:var(--gold)}
.reveal.t0 .t{color:var(--bad)}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(245,200,75,.9)}100%{box-shadow:0 0 0 40px rgba(245,200,75,0)}}
@media(prefers-reduced-motion:reduce){#diver,.air div{transition:none}.flash{animation:none}}
/* results */
.big{font-size:clamp(3rem,10vw,5rem);font-weight:800;letter-spacing:-.04em;line-height:1}
.rows{margin:18px 0;display:grid;gap:8px}
.rows div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:.95rem}
.rows span:first-child{color:var(--mute)}
/* board */
.board{margin-top:28px;border:1px solid var(--line);border-radius:24px;padding:22px 24px;background:rgba(3,11,20,.55)}
.board h2{font-size:1.15rem;margin-bottom:12px}
.row{display:grid;grid-template-columns:32px 1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.row:last-child{border:0}
.row .n{color:var(--mute)}
.row.me{color:var(--gold)}
.row em{font-style:normal;color:var(--mute)}
/* auth */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,11,20,.88);z-index:20}
#auth.hidden{display:none}
.box{width:100%;max-width:360px;background:var(--deep);border:1px solid var(--line);border-radius:24px;padding:26px}
.box h2{font-size:1.5rem;margin-bottom:4px}
.box p{color:var(--mute);font-size:.9rem;margin-bottom:16px}
.box label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
.box input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.box .go{width:100%;padding:12px;margin-top:18px}
.sw{background:none;border:0;color:var(--aqua);margin-top:14px;font-size:.9rem;text-decoration:underline}
#err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Crown<span>llion</span></div>
    <div class="who" id="who"></div>
  </header>

  <div class="stage">
    <div>
      <div class="gauge" id="gauge"></div>
      <div class="depth"><span id="depth">0 m</span><small id="pts">0 pts</small></div>
    </div>
    <div class="card" id="card"></div>
  </div>

  <section class="board">
    <h2>Today's team dive</h2>
    <div id="lb"><p style="color:var(--mute)">Loading scores…</p></div>
  </section>
</div>

<div id="auth">
  <div class="box">
    <h2 id="a-title">Welcome back</h2>
    <p id="a-sub">Log in to dive with the team.</p>
    <form id="a-form">
      <label for="u">Username</label><input id="u" required autocomplete="username">
      <label for="p">Password</label><input id="p" type="password" required minlength="6" autocomplete="current-password">
      <button class="go" id="a-btn">Log in</button>
      <div id="err" role="alert"></div>
    </form>
    <button class="sw" id="a-sw" type="button">New here? Create an account</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDtvXvvKSDW4w781kYm2e4lg47cC7Lx6NY", authDomain:"crownllion.firebaseapp.com", projectId:"crownllion",
  storageBucket:"crownllion.firebasestorage.app", messagingSenderId:"65215415079", appId:"1:65215415079:web:5558871761efd11e48df02"
});
const auth = getAuth(app), db = getFirestore(app);

/* ---------- Game data: tier points -> accepted answers ---------- */
const TIERS = {0:["Not on the sheet"],10:["Plankton"],15:["Too Clever"],30:["Schooler"],60:["Rare"],85:["Deep Cut"],100:["One in a Krillion"]};
const PROMPTS = [
 {q:"Name a type of sausage", a:{10:["bratwurst","hot dog","pepperoni","chorizo","salami"],15:["liverwurst"],30:["kielbasa","andouille","mortadella","bologna","chipolata"],60:["boudin","merguez","lap cheong","cumberland","weisswurst"],85:["sobrasada","nduja","saucisson","zampone","lukanka"],100:["sujuk","blutwurst","isterband","landjager"]}},
 {q:"Name a country in Africa", a:{10:["egypt","nigeria","kenya","south africa"],15:["morocco"],30:["ghana","ethiopia","tanzania","algeria","senegal"],60:["namibia","botswana","malawi","mali","angola"],85:["eswatini","djibouti","burkina faso","lesotho","gabon"],100:["sao tome and principe","comoros","equatorial guinea","eritrea"]}},
 {q:"Name a chess opening", a:{10:["sicilian defense","queens gambit","italian game","ruy lopez"],15:["kings gambit"],30:["french defense","caro-kann","london system","english opening"],60:["scandinavian defense","pirc defense","catalan opening","benoni defense"],85:["alekhine's defense","grunfeld defense","vienna game","budapest gambit"],100:["orangutan opening","grob attack","elephant gambit","latvian gambit"]}},
 {q:"Name a cheese", a:{10:["cheddar","brie","mozzarella","parmesan"],15:["stilton"],30:["gouda","gruyere","halloumi","feta","camembert"],60:["manchego","taleggio","cotija","havarti","pecorino"],85:["stichelton","epoisses","mimolette","cabrales","raclette"],100:["ossau-iraty","appenzeller","casu marzu","vacherin mont d'or"]}},
 {q:"Name a programming language", a:{10:["python","java","javascript","c++"],15:["haskell"],30:["rust","kotlin","swift","ruby","php"],60:["erlang","ocaml","lua","scala","julia"],85:["forth","prolog","nim","smalltalk","zig"],100:["apl","janet","pony","brainfuck","j"]}},
 {q:"Name a musical instrument", a:{10:["guitar","piano","drums","violin"],15:["theremin"],30:["oboe","banjo","harp","cello","ukulele"],60:["sitar","marimba","bagpipes","zither","dulcimer"],85:["hurdy gurdy","nyckelharpa","ocarina","kora","oud"],100:["cimbalom","serpent","glass armonica","hang drum"]}},
 {q:"Name a famous bridge", a:{10:["golden gate bridge","brooklyn bridge","london bridge"],15:["tower bridge"],30:["rialto bridge","sydney harbour bridge","ponte vecchio","millau viaduct"],60:["charles bridge","pont du gard","bridge of sighs","akashi kaikyo bridge"],85:["stari most","kintai bridge","helix bridge","pont neuf"],100:["khaju bridge","bixby creek bridge","si-o-se-pol","ha'penny bridge"]}}
];
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
PROMPTS.forEach(p=>{p.map={};for(const [pts,list] of Object.entries(p.a))list.forEach(w=>p.map[norm(w)]=+pts);});
const lookup=(p,g)=>{const n=norm(g);return p.map[n]??p.map[n.replace(/s$/,"")]??0;};
const bearing = t => t>=450?"One in a Krillion":t>=351?"Deep Cut":t>=251?"Rare":t>=151?"Schooler":"Plankton";

const TIME=25, MAXDEPTH=7000;
const today = new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
let user=null, i=0, total=0, results=[], timer=null, left=TIME, locked=false, started=null;

/* ---------- Gauge ---------- */
$("gauge").innerHTML = [0,1000,2000,3000,4000,5000,6000,7000].map(m=>`<i style="top:${m/MAXDEPTH*92+4}%"><b>${m}</b></i>`).join("")+`<div id="diver">🦐</div>`;
function sink(){
  const m=total*10;
  $("diver").style.top=(2+Math.min(m/MAXDEPTH,1)*92)+"%";
  $("depth").textContent=m.toLocaleString()+" m";
  $("pts").textContent=total+" pts";
}

/* ---------- Game flow ---------- */
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function showPrompt(){
  const p=PROMPTS[i]; left=TIME; locked=false;
  const card=$("card"); card.innerHTML="";
  const top=el("div","top"); top.append(el("span","",`Prompt ${i+1} of ${PROMPTS.length}`));
  const dots=el("div","dots"); PROMPTS.forEach((_,k)=>dots.append(el("u",k<i?"done":k===i?"on":"")));
  top.append(dots); card.append(top);
  const air=el("div","air"); air.id="air"; air.append(el("div")); card.append(air);
  const q=el("h1","q"); q.append(el("small","","Rarest valid answer wins")); q.append(p.q); card.append(q);
  const f=el("form","g"); f.innerHTML=`<input id="gi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="Type your answer"><button class="go" id="gb">Dive</button>`;
  card.append(f); const rv=el("div","reveal"); rv.id="rv"; rv.setAttribute("aria-live","polite"); card.append(rv);
  f.addEventListener("submit",e=>{e.preventDefault();answer($("gi").value);});
  $("gi").focus(); tick(true);
  clearInterval(timer);
  timer=setInterval(tick,1000);
}
function tick(init){
  if(!init)left--;
  const a=$("air"); if(!a)return;
  a.firstChild.style.width=Math.max(left,0)/TIME*100+"%";
  a.classList.toggle("low",left<=8);
  if(left<=0)answer("");
}
function answer(g){
  if(locked)return; locked=true; clearInterval(timer);
  const p=PROMPTS[i], pts=g.trim()?lookup(p,g):0;
  total+=pts; results.push({q:p.q,guess:g.trim()||"(no answer)",pts});
  $("gi").disabled=true; $("gb").disabled=true;
  const rv=$("rv"); rv.className="reveal t"+pts;
  rv.innerHTML=""; rv.append(el("div","t",TIERS[pts][0]));
  rv.append(el("div","",pts?`+${pts} pts · ${pts*10} m deeper`:"No points. Rarity only counts if the answer fits the prompt."));
  if(pts===100)$("card").classList.add("flash");
  sink();
  setTimeout(()=>{$("card").classList.remove("flash");i++;i<PROMPTS.length?showPrompt():finish(true);},1700);
}
async function finish(save){
  clearInterval(timer);
  const card=$("card"); card.innerHTML="";
  card.append(el("div","top",`Dive complete · ${today}`));
  card.append(el("div","big",total.toLocaleString()+" pts"));
  card.append(el("p","",`${(total*10).toLocaleString()} m deep. You reached ${bearing(total)} depth.`));
  const rows=el("div","rows");
  results.forEach(r=>{const d=el("div");d.append(el("span","",r.q.replace("Name a ","").replace("Name ","")),el("span","",`${r.guess} · ${r.pts}`));rows.append(d);});
  card.append(rows);
  const share=el("button","go","Copy result"); share.style.padding="12px 22px";
  share.onclick=()=>{navigator.clipboard.writeText(`Crownllion ${today}\n${total} pts · ${total*10} m\n`+results.map(r=>r.pts>=100?"🟨":r.pts>=60?"🟧":r.pts>0?"🟦":"⬛").join(""));share.textContent="Copied";};
  card.append(share);
  if(save){try{await setDoc(doc(db,"scores",`${today}_${user.uid}`),{user:user.displayName||user.email.split("@")[0],uid:user.uid,score:total,puzzleId:today,results,createdAt:serverTimestamp()});}catch(e){console.error(e);}}
}

/* ---------- Auth ---------- */
let signup=false;
const setMode=s=>{signup=s;$("a-title").textContent=s?"Join the team":"Welcome back";$("a-sub").textContent=s?"Pick a username and password.":"Log in to dive with the team.";$("a-btn").textContent=s?"Create account":"Log in";$("a-sw").textContent=s?"Already have an account? Log in":"New here? Create an account";$("err").textContent="";};
$("a-sw").onclick=()=>setMode(!signup);
$("a-form").addEventListener("submit",async e=>{
  e.preventDefault(); $("err").textContent="";
  const name=$("u").value.trim(), email=name.toLowerCase().replace(/\s+/g,"")+"@team.local", pw=$("p").value;
  try{
    if(signup){const c=await createUserWithEmailAndPassword(auth,email,pw);await updateProfile(c.user,{displayName:name});await c.user.reload();begin(auth.currentUser);}
    else await signInWithEmailAndPassword(auth,email,pw);
  }catch(err){$("err").textContent=err.message.replace("Firebase: ","");}
});
let begun=null;
async function begin(u){
  if(begun===u.uid)return; begun=u.uid; user=u;
  $("auth").classList.add("hidden");
  const w=$("who"); w.innerHTML=""; w.append(el("span","",u.displayName||u.email.split("@")[0]));
  const out=el("button","ghost","Log out"); out.onclick=()=>signOut(auth); w.append(out);
  total=0;i=0;results=[];sink();
  const snap=await getDoc(doc(db,"scores",`${today}_${u.uid}`));
  if(snap.exists()){const d=snap.data();total=d.score;results=d.results||[];sink();finish(false);}
  else showPrompt();
}
onAuthStateChanged(auth,u=>{
  if(u)begin(u);
  else{begun=null;user=null;clearInterval(timer);$("who").innerHTML="";$("auth").classList.remove("hidden");}
});

/* ---------- Leaderboard ---------- */
onSnapshot(query(collection(db,"scores"),where("puzzleId","==",today)),snap=>{
  const rows=snap.docs.map(d=>d.data()).sort((a,b)=>b.score-a.score);
  const lb=$("lb"); lb.innerHTML="";
  if(!rows.length){lb.append(el("p","","No dives yet today. Be the first in the water."));lb.lastChild.style.color="var(--mute)";return;}
  rows.forEach((r,k)=>{
    const d=el("div","row"+(user&&r.uid===user.uid?" me":""));
    d.append(el("span","n",k+1),el("span","",r.user),el("em","",(r.score*10).toLocaleString()+" m"),el("strong","",r.score+" pts"));
    lb.append(d);
  });
});
</script>
</body>
</html>
