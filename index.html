<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 11%27%3E%3Cpath fill=%27%23ffd23f%27 d=%27M1 1h2v3H1zM7 0h2v4H7zM13 1h2v3h-2zM1 4h14v7H1z%27/%3E%3C/svg%3E">
<title>Crownllion – the daily dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--cy:#3fd8f0;--pk:#ff4f8b;--ink:#dff3fa;--navy:#0f1b33;--bg:#050a14;--gold:#ffd23f}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"VT323",ui-monospace,monospace;font-size:1.35rem;color:var(--ink);background:var(--bg);overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#world{position:fixed;inset:0;z-index:0;background-color:#8fc8e4;background-image:linear-gradient(180deg,#8fc8e4 0,#e3f1f7 5.4%,#2a78ab 5.6%,#1c5b8c 8%,#0e3659 16%,#07182e 30%,#050a14 50%,#03060c 100%);background-size:100% 500%;background-repeat:no-repeat;background-position:0 0;transition:background-position 1.8s ease-in-out}
#bw{position:fixed;inset:0;z-index:1;pointer-events:none;transition:transform 1.8s ease-in-out}
#sky{position:fixed;inset:0;z-index:1;pointer-events:none;transition:transform 1.8s ease-in-out}
.cloud{position:absolute;height:auto;image-rendering:pixelated}
.boat{position:absolute;left:max(6vw,calc(50% - 480px));top:calc(28vh - 128px);width:224px;animation:bob 3.2s steps(4) infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
/* pixel controls */
.px{letter-spacing:.3em;text-transform:uppercase;background:var(--navy);color:#fff;border:3px solid var(--cy);padding:12px 22px;box-shadow:4px 4px 0 #02050a;cursor:pointer;font-size:1.4rem}
.px:hover{background:#17294f}
.px:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #02050a}
.px:disabled{opacity:.45;cursor:not-allowed}
.px.sm{padding:4px 12px;font-size:1.1rem;letter-spacing:.15em}
#who{position:fixed;top:14px;right:14px;z-index:30;display:flex;gap:10px;align-items:center;font-size:1.2rem;text-shadow:2px 2px 0 #02050a}
/* auth */
#auth{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:9vh 16px 16px;overflow:auto}
#auth.hidden{display:none}
.title{position:relative;font-size:clamp(3.6rem,15vw,9rem);line-height:1;letter-spacing:.1em;color:transparent;padding-left:.1em}
.title::before,.title::after{content:attr(data-t);position:absolute;inset:0;padding-left:.1em;-webkit-text-stroke:2px}
.title::before{-webkit-text-stroke-color:var(--pk);transform:translateX(-3px)}
.title::after{-webkit-text-stroke-color:var(--cy);transform:translateX(3px)}
.sub{margin-top:14px;color:var(--cy);font-size:clamp(1.4rem,4vw,2rem);letter-spacing:.5em;padding-left:.5em;text-shadow:2px 2px 0 rgba(5,10,20,.3)}
.rules{margin-top:10px;font-size:1.2rem;letter-spacing:.12em;color:#274a63;text-align:center}
.box{margin-top:clamp(70px,22vh,200px);width:min(440px,100%);background:var(--navy);border:3px solid var(--cy);box-shadow:6px 6px 0 #02050a;padding:22px}
.box h2{font-size:2rem;letter-spacing:.2em;font-weight:400;text-transform:uppercase}
.box label{display:block;margin:14px 0 4px;color:var(--cy);letter-spacing:.2em;text-transform:uppercase;font-size:1.1rem}
.box input{width:100%;background:var(--bg);border:2px solid #25507a;padding:8px 12px;font-size:1.5rem}
.box input:focus{border-color:var(--cy);outline:none}
.box .px{width:100%;margin-top:20px}
#err{color:var(--pk);min-height:1.2em;margin-top:10px}
.hidden{display:none!important}
#home{margin-top:clamp(70px,22vh,200px);width:min(600px,100%);text-align:center}
.begin{width:100%;font-size:2.2rem;letter-spacing:.4em;padding:20px 12px;border-width:4px}
.dive-no{margin-top:14px;color:var(--cy);letter-spacing:.2em;font-size:1.15rem;text-shadow:2px 2px 0 #02050a}
.sw{background:none;border:0;color:var(--cy);margin-top:12px;text-decoration:underline;cursor:pointer;letter-spacing:.08em}
/* game */
main{position:relative;z-index:5;max-width:680px;margin:0 auto;padding:25vh 18px 130px;width:100%}
body:not(.in) main,body:not(.in) #ruler,body:not(.in) #hud,body:not(.in) #bar,body:not(.in) #fish,body:not(.in) #pc{display:none}
body.in #who{top:96px;left:8px;right:auto;flex-direction:column;align-items:flex-start;gap:6px}
.top{display:flex;justify-content:space-between;color:var(--cy);letter-spacing:.15em;text-transform:uppercase;font-size:1.2rem}
.clock{display:flex;align-items:center;gap:14px;margin:10px 0 26px}
.secs{font-size:3.4rem;line-height:1;min-width:2ch;text-align:right;color:#fff;text-shadow:3px 3px 0 #02050a}
.secs.low{color:var(--pk)}
.clock .air{flex:1;margin:0}
.air{height:14px;margin:12px 0 30px;border:2px solid #25507a;padding:2px}
.air div{height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--cy) 0 10px,transparent 10px 13px);transition:width 1s linear}
.air.low div{background:repeating-linear-gradient(90deg,var(--pk) 0 10px,transparent 10px 13px)}
.q{font-weight:400;font-size:clamp(2.6rem,9vw,4.4rem);line-height:.95;color:#fff;text-shadow:4px 4px 0 #02050a;margin-bottom:28px}
.q small{display:block;font-size:1.3rem;color:var(--cy);letter-spacing:.2em;text-transform:uppercase;text-shadow:none;margin-bottom:10px}
form.g{display:flex;gap:12px}
.g input{flex:1;min-width:0;background:var(--bg);border:3px solid #25507a;padding:8px 14px;font-size:1.7rem}
.g input:focus{border-color:var(--cy);outline:none}
.reveal{min-height:84px;margin-top:20px;font-size:1.4rem}
.reveal .t{font-size:2.6rem;line-height:1;text-shadow:3px 3px 0 #02050a}
.t0 .t{color:var(--pk)}.t30 .t,.t60 .t{color:var(--cy)}.t85 .t{color:var(--pk)}.t100 .t{color:var(--gold)}
.ds{font-size:2.4rem;letter-spacing:.3em;text-align:center;margin-top:20vh;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.flash{animation:fl .7s steps(3)}
@keyframes fl{50%{filter:brightness(2.2)}}
.big{font-size:clamp(4rem,14vw,7rem);line-height:1;color:#fff;text-shadow:4px 4px 0 var(--pk)}
.rows{margin:16px 0}
.rows details{border-bottom:2px dashed #25507a;padding:5px 0}
.rows summary{display:flex;gap:12px;cursor:pointer;list-style:none}
.rows summary::-webkit-details-marker{display:none}
.rows summary span:first-child{flex:1;color:var(--cy)}
.rows summary::after{content:"\25BE";color:var(--cy)}
.rows details[open] summary::after{content:"\25B4"}
.sheet{margin:8px 0 6px;padding:10px 12px;background:rgba(5,10,20,.6);border-left:3px solid var(--cy);font-size:1.15rem}
.sheet p{margin:0 0 8px}.sheet b{font-weight:400}
.sheet .mine{color:var(--gold);text-decoration:underline}
#crown{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,20,.62);pointer-events:none}
#crown svg{width:min(55vw,250px);height:auto;filter:drop-shadow(6px 6px 0 #02050a);animation:pop .5s steps(5) both}
#crown.gold svg{filter:drop-shadow(0 0 26px #ffd23f) drop-shadow(6px 6px 0 #02050a)}
#crown p{font-size:2.8rem;letter-spacing:.2em;text-transform:uppercase;margin-top:14px;text-shadow:3px 3px 0 #02050a;line-height:1}
@keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
body:not(.res) .panel{display:none}
.panel{margin-top:40px;background:rgba(15,27,51,.88);border:3px solid var(--cy);box-shadow:6px 6px 0 #02050a;padding:18px}
.panel h2{font-weight:400;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.row{display:grid;grid-template-columns:34px 1fr auto auto;gap:12px;padding:4px 0;border-bottom:2px dashed #25507a}
.row:last-child{border:0}
.row.me{color:var(--gold)}
.row em{font-style:normal;color:var(--cy)}
/* depth ruler */
#ruler{position:fixed;z-index:6;right:10px;top:10vh;height:80vh;width:70px;border-right:3px solid #25507a;font-size:1rem;color:#7fb7d4}
#ruler .tk{position:absolute;right:0;width:100%;text-align:right;padding-right:10px;border-bottom:2px solid #25507a;transform:translateY(-100%)}
#mk{position:absolute;right:-12px;top:0;transition:top 1.4s steps(14)}
@media(prefers-reduced-motion:reduce){*,#world,#sky{transition:none!important;animation:none!important}}
@media(max-width:560px){#ruler{width:48px}.boat{width:150px;top:calc(28vh - 86px)}.hp{width:96px!important;padding:8px 10px!important}.hp b{font-size:1.7rem!important}#hud{gap:8px!important}}
/* game screen */
:root{--n:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px))}
#hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:center;gap:clamp(16px,16vw,330px);padding:6px 12px;align-items:flex-start;pointer-events:none}
.hp{width:150px;padding:10px 18px;background:rgba(5,10,20,.9);clip-path:var(--n)}
.hp small,.pg small{display:block;letter-spacing:.3em;font-size:.95rem;color:#7fb7d4;text-transform:uppercase}
.hp b{display:block;font-weight:400;font-size:2.2rem;line-height:1;color:var(--cy)}
.hp.r{text-align:right}.hp.r b{color:var(--pk)}
.pg{text-align:center;padding-top:22px}
#seg{display:flex;gap:2px;justify-content:center}
#seg i{width:18px;height:18px;background:var(--navy);border:2px solid #02050a}
.pg small{margin-top:6px;font-size:.9rem}
.pcard{width:min(600px,100%);margin:0 auto;background:rgba(5,10,20,.84);padding:22px 30px;clip-path:var(--n)}
.pcard .pl{display:block;color:var(--pk);letter-spacing:.3em;text-transform:uppercase;font-size:1.1rem}
.pcard .q{font-size:clamp(2rem,5.5vw,3rem);line-height:1.1;margin:10px 0}
.hint{color:#7fb7d4;letter-spacing:.2em;font-size:1.05rem}
.miss{color:var(--pk);min-height:1.3em;margin-top:6px}
.rcard{text-align:center;padding-top:4vh}
.rt{font-weight:400;font-size:clamp(3rem,9vw,5.5rem);line-height:1;letter-spacing:.08em;text-transform:uppercase;text-shadow:4px 4px 0 #02050a;color:#a9bccb}
.ra{font-size:2rem;margin-top:14px}.rp{font-size:2.4rem;color:var(--ink);margin-top:6px;text-transform:uppercase}.rf{color:#7fb7d4;letter-spacing:.12em;margin-top:8px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:34px 16px 22px;display:flex;justify-content:center;background:linear-gradient(180deg,transparent,rgba(3,8,16,.96) 45%)}
#bar.hidden{display:none}
#gf{display:flex;gap:14px;align-items:flex-start;width:min(760px,100%)}
.dial{width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:2.4rem;color:var(--cy);background:radial-gradient(circle,#091426 0 56%,transparent 58%),conic-gradient(var(--c,var(--cy)) var(--p,100%),#14264a 0)}
.dial.low{--c:var(--pk);color:var(--pk)}
.mid{flex:1;min-width:0;padding-top:10px}
.mid input{width:100%;height:58px;background:#050a14;border:3px solid var(--cy);padding:4px 16px;font-size:1.8rem}
.mid input:focus{outline:none;box-shadow:0 0 0 3px rgba(63,216,240,.25)}
#bar .air{height:6px;margin:6px 0 0;border:0;padding:0;background:#10203c}
#bar .air div{background:var(--cy)}#bar .air.low div{background:var(--pk)}
.px.pink{background:var(--pk);border-color:var(--pk);color:#fff;height:58px;margin-top:10px}
.px.dsc{width:min(420px,90vw);font-size:1.8rem;letter-spacing:.35em;border-width:4px}
#fish{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.fish{position:absolute;left:0;animation:swim linear infinite}
@keyframes swim{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}
#pc{position:fixed;left:24px;top:72vh;z-index:6;width:46px;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 0 12px rgba(255,210,63,.7));animation:bob 3s steps(4) infinite}
#pc svg{display:block;width:100%;height:auto;transform-origin:50% 60%}
#pc svg.spin{animation:spin .85s ease-out}
#pc svg.dive{animation:dive 1.8s ease-in-out}
@keyframes spin{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-26px) rotate(240deg) scale(1.2)}65%{transform:translateY(-8px) rotate(520deg) scale(1.1)}100%{transform:translateY(0) rotate(720deg) scale(1)}}
@keyframes dive{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(var(--dd,12vh)) rotate(-14deg)}100%{transform:translateY(0) rotate(0)}}
#sug{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:2;background:rgba(5,10,20,.95);clip-path:var(--n);padding:10px 26px;text-align:center;white-space:nowrap;font-size:1.4rem}
#sug i{font-style:normal;color:#9db6c6}#sug b{font-weight:400;color:var(--cy)}
#sug small{display:block;margin-top:4px;color:#7fb7d4;letter-spacing:.12em;font-size:1rem}
.rf2{margin-top:6px;color:#4f7a94;letter-spacing:.15em;font-size:1.1rem}
.rc svg{display:block;width:76px;height:auto;margin:16px auto 0;filter:drop-shadow(3px 3px 0 #02050a);animation:pop .45s steps(5) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.rc+.ra{margin-top:12px}
</style>
</head>

 {q:"Name a programming language", a:{10:["python","java","javascript","c++"],15:["haskell"],30:["rust","kotlin","swift","ruby","php"],60:["erlang","ocaml","lua","scala","julia"],85:["forth","prolog","nim","smalltalk","zig"],100:["apl","janet","pony","brainfuck","j"]}},
 {q:"Name a musical instrument", a:{10:["guitar","piano","drums","violin"],15:["theremin"],30:["oboe","banjo","harp","cello","ukulele"],60:["sitar","marimba","bagpipes","zither","dulcimer"],85:["hurdy gurdy","nyckelharpa","ocarina","kora","oud"],100:["cimbalom","serpent","glass armonica","hang drum"]}},
 {q:"Name a famous bridge", a:{10:["golden gate bridge","brooklyn bridge","london bridge"],15:["tower bridge"],30:["rialto bridge","sydney harbour bridge","ponte vecchio","millau viaduct"],60:["charles bridge","pont du gard","bridge of sighs","akashi kaikyo bridge"],85:["stari most","kintai bridge","helix bridge","pont neuf"],100:["khaju bridge","bixby creek bridge","si-o-se-pol","ha'penny bridge"]}}
];
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const prep=ps=>{ps.forEach(p=>{p.map={};for(const [pts,l] of Object.entries(p.a))l.forEach(w=>p.map[norm(w)]=+pts);});return ps;}; prep(PROMPTS);
const lookup=(p,g)=>{const n=norm(g);return p.map[n]??p.map[n.replace(/s$/,"")]??0;};
const bearing = t => t>=450?"One in a Krillion":t>=351?"Deep Cut":t>=251?"Rare":t>=151?"Schooler":"Plankton";

const CC={10:"#9aa7b4",15:"#5fd38d",30:"#4aa8ff",60:"#ff9f43",85:"#9b7bff",100:"#ffd23f"};
const CROWN=c=>`<svg viewBox="0 0 16 11" shape-rendering="crispEdges"><path fill="${c}" d="M1 1h2v3H1zM7 0h2v4H7zM13 1h2v3h-2zM3 3h2v1H3zM11 3h2v1h-2zM1 4h14v7H1z"/><path fill="#000" opacity=".28" d="M1 9h14v2H1z"/><path fill="#fff" d="M7 5h2v2H7z"/></svg>`;
const TIME=25, MAXDEPTH=7000;
const today = new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
let tries=[], user=null, i=0, total=0, results=[], timer=null, left=TIME, locked=false;

/* ---------- Scene: sky lifts away and the sea darkens as you sink ---------- */
for(let m=0;m<=MAXDEPTH;m+=1000){const t=el("div","tk",m+"m");t.style.top=(m/MAXDEPTH*100)+"%";$("ruler").append(t);}
function scene(p,off=0){const y=-p*4*innerHeight;$("world").style.backgroundPosition=`0 ${y+off}px`;$("sky").style.transform=`translateY(${y}px)`;$("bw").style.transform=`translateY(${y+off}px)`;}
$("pc").onclick=()=>{const v=$("pc").firstElementChild;v.classList.remove("spin","dive");void v.getBoundingClientRect();v.classList.add("spin");};
const home=()=>scene(0,innerHeight*.34);
const FLAVOR={10:"the answer everyone blurts out.",15:"too clever. everyone reaches for it.",30:"solid. swimming with the school.",60:"genuinely uncommon. nice pull.",85:"real obscurity. not many get this deep.",100:"one in a krillion. trench floor."};
function hud(){
  const sg=$("seg"); sg.innerHTML="";
  PROMPTS.forEach((_,k)=>{const b=document.createElement("i");
    if(k<results.length)b.style.background=results[k].pts?CC[results[k].pts]:"#5a6b7d";
    else if(k===results.length)b.style.background="var(--pk)";
    sg.append(b);});
  $("pl").textContent=`Prompt ${Math.min(results.length+1,PROMPTS.length)} of ${PROMPTS.length}`;
}
function sink(){
  const m=total*10,f=Math.min(m/MAXDEPTH,1);
  scene(Math.sqrt(f)*.9,0);
  $("mk").style.top=`calc(${f*100}% - 11px)`;
  $("hd").textContent=m.toLocaleString()+"m"; $("hs").textContent=total; hud();
}
home();
for(let k=0;k<6;k++){const f=el("div","fish");f.style.cssText=`top:${38+Math.random()*52}vh;animation-duration:${40+Math.random()*50}s;animation-delay:-${Math.random()*60}s`;f.innerHTML='<svg viewBox="0 0 14 6" width="28" shape-rendering="crispEdges"><path fill="#06223d" d="M0 0l3 3-3 3zM3 1h8v4H3zM11 2h3v2h-3z"/></svg>';$("fish").append(f);}

/* ---------- Game flow ---------- */
function showPrompt(){
  const p=PROMPTS[i]; left=TIME; locked=false; tries=[]; document.body.classList.remove("res");
  const card=$("card"); card.className="pcard"; card.innerHTML="";
  card.append(el("small","pl",`Prompt ${i+1} of ${PROMPTS.length}`),el("h1","q",p.q),el("p","hint","\u25BC rarer answers sink deeper \u25BC"));
  const rv=el("p","miss"); rv.id="rv"; rv.setAttribute("aria-live","polite"); card.append(rv);
  const bar=$("bar"); bar.className="";
  bar.innerHTML=`<div id="sug" class="hidden"></div><form id="gf"><div class="dial" id="dial"><span id="secs">${TIME}</span></div><div class="mid"><input id="gi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="type your answer"><div class="air" id="air"><div></div></div></div><button class="px pink" id="gb">Dive</button></form>`;
  $("gf").addEventListener("submit",e=>{e.preventDefault();guess($("gi").value);});
  $("gi").addEventListener("input",()=>$("sug").classList.add("hidden"));
  sink(); $("gi").focus(); tick(true);
  clearInterval(timer); timer=setInterval(tick,1000);
}
function tick(init){
  if(!init)left--;
  const a=$("air"); if(!a)return;
  const l=Math.max(left,0), low=left<=8, dl=$("dial");
  a.firstChild.style.width=l/TIME*100+"%"; a.classList.toggle("low",low);
  dl.style.setProperty("--p",l/TIME*100+"%"); dl.classList.toggle("low",low); $("secs").textContent=l;
  if(left<=0)settle("",true);
}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,r)=>[r,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let r=1;r<=m;r++)for(let j=1;j<=n;j++)d[r][j]=Math.min(d[r-1][j]+1,d[r][j-1]+1,d[r-1][j-1]+(a[r-1]===b[j-1]?0:1));return d[m][n];}
const titleCase=w=>w.replace(/(^|[\s-])([a-z])/g,(m,x,c)=>x+c.toUpperCase());
function suggest(p,g){
  const n=norm(g); if(n.length<4)return null;
  const max=n.length>=8?2:1; let best=null,bd=99;
  for(const [pts,list] of Object.entries(p.a))for(const w of list){const d=lev(n,norm(w));if(d>0&&(d<bd||(d===bd&&+pts>best.pts))){bd=d;best={w,pts:+pts};}}
  return bd<=max?best.w:null;
}
function showSug(from,to){
  const s=$("sug"); s.innerHTML=""; const l=el("div");
  l.append(el("i","",`\u201C${from}\u201D`)," \u2192 ",el("b","",`\u201C${to}\u201D`));
  s.append(l,el("small","","submit again to confirm \u00B7 or edit")); s.classList.remove("hidden");
}
/* a guess that isn't on the answer sheet doesn't end the prompt */
function guess(g){
  if(locked)return; g=g.trim(); if(!g)return;
  if(lookup(PROMPTS[i],g))return settle(g);
  const near=suggest(PROMPTS[i],g);
  if(near){const t=titleCase(near);$("gi").value=t;$("gi").focus();showSug(g,t);return;}
  const dupe=tries.includes(norm(g)); if(!dupe)tries.push(norm(g));
  $("rv").textContent=dupe?"already tried. think rarer.":"not on the sheet. try another.";
  const gi=$("gi"); gi.value=""; gi.focus();
}
function settle(g,timedout){
  if(locked)return; locked=true; clearInterval(timer);
  const p=PROMPTS[i], pts=g.trim()?lookup(p,g):0;
  total+=pts; results.push({q:p.q,guess:g.trim()||"(no answer)",pts,tries:tries.length});
  const card=$("card"); card.className="rcard"; card.innerHTML="";
  const col=CC[pts]||"#a9bccb", h=el("h1","rt",pts?TIERS[pts][0]:"Nothing landed"); h.style.color=col;
  const rp=el("p","rp"), pp=el("span","",`+${pts} pts`); pp.style.color=col; rp.append(pp,pts?` \u00B7 sink ${pts*10}m`:"");
  const rc=el("div","rc"); if(pts)rc.innerHTML=CROWN(col);
  card.append(h,rc,el("p","ra",g.trim()?`\u201C${g.trim()}\u201D`:"\u2014"),rp,
    el("p","rf",pts?FLAVOR[pts]:(timedout?"the clock beat you to it.":"that answer didn't fit.")),
    el("p","rf2",`total depth ${(total*10).toLocaleString()}m`));
  $("sug")&&$("sug").classList.add("hidden");
  const bar=$("bar"); bar.innerHTML="";
  const nb=el("button","px dsc",i+1<PROMPTS.length?"Descend \u25BC":"Results \u25BC");
  nb.onclick=()=>{i++;i<PROMPTS.length?showPrompt():finish(true);};
  bar.append(nb); nb.focus();
  if(pts){ /* the crown dives further the more points you scored */
    const v=$("pc").firstElementChild; v.style.setProperty("--dd",`${4+pts*.18}vh`);
    v.classList.remove("dive","spin"); void v.getBoundingClientRect(); v.classList.add("dive");
  }
  sink();
}
async function finish(save){
  clearInterval(timer); document.body.classList.add("res"); $("bar").className="hidden"; $("card").className="";
  const card=$("card"); card.innerHTML="";
  card.append(el("div","top",`Dive complete · ${today}`));
  card.append(el("div","big",total.toLocaleString()+" pts"));
  card.append(el("p","",`${(total*10).toLocaleString()} m deep. You reached ${bearing(total)} depth.`));
  const rows=el("div","rows");
  results.forEach(r=>{
    const d=document.createElement("details"), sm=document.createElement("summary");
    sm.append(el("span","",r.q.replace("Name a ","").replace("Name ","")),el("span","",`${r.guess} · ${r.pts}`));
    d.append(sm);
    const sheet=PROMPTS.find(x=>x.q===r.q), box=el("div","sheet");
    if(sheet){
      Object.keys(sheet.a).map(Number).sort((x,y)=>y-x).forEach(pts=>{
        const line=el("p"), tag=el("b","",`${TIERS[pts]?TIERS[pts][0]:""} · ${pts}  `); tag.style.color=CC[pts]||"#fff"; line.append(tag);
        sheet.a[pts].forEach((w,k)=>{line.append(el("span",norm(w)===norm(r.guess)?"mine":"",w));if(k<sheet.a[pts].length-1)line.append(", ");});
        box.append(line);
      });
    }else box.textContent="Answer sheet not available.";
    d.append(box); rows.append(d);
  });
  card.append(rows);
  const share=el("button","px","Copy result");
  share.onclick=()=>{navigator.clipboard.writeText(`Crownllion ${today}\n${total} pts · ${total*10} m\n`+results.map(r=>r.pts>=100?"🟨":r.pts>=60?"🟧":r.pts>0?"🟦":"⬛").join(""));share.textContent="Copied";};
  card.append(share);
  const note=el("p","",""); note.id="pend"; note.style.marginTop="14px"; card.append(note);
  if(save)await saveScore();
}
async function saveScore(){
  const n=$("pend");
  try{await setDoc(doc(db,"scores",`${today}_${user.uid}`),{user:user.displayName||user.email.split("@")[0],uid:user.uid,score:total,puzzleId:today,results,createdAt:serverTimestamp()});if(n)n.textContent="Score saved to the leaderboard.";}
  catch(e){console.error(e);if(n)n.textContent="Couldn't save score ("+(e.code||e.message)+"). Check your Firestore rules.";}
}

/* ---------- Auth (shown first) ---------- */
let signup=false;
const setMode=s=>{signup=s;$("a-title").textContent=s?"Sign up":"Log in";$("a-btn").textContent=s?"Create account":"Log in";$("a-sw").textContent=s?"Already have an account? Log in":"New here? Create an account";$("err").textContent="";};
$("a-sw").onclick=()=>setMode(!signup);
$("a-form").addEventListener("submit",async e=>{
  e.preventDefault(); $("err").textContent="";
  const name=$("u").value.trim(), email=name.toLowerCase().replace(/\s+/g,"")+"@team.local", pw=$("p").value;
  try{
    if(signup){const c=await createUserWithEmailAndPassword(auth,email,pw);await updateProfile(c.user,{displayName:name});await c.user.reload();begin(auth.currentUser);}
    else await signInWithEmailAndPassword(auth,email,pw);
  }catch(err){$("err").textContent=err.message.replace("Firebase: ","");}
});

let begun=null;
/* Questions: Firestore dives/<YYYY-MM-DD>, then dives/default, then the built-in set */
async function loadPrompts(){
  for(const id of [today,"default"]){
    try{
      const s=await getDoc(doc(db,"dives",id));
      if(s.exists()&&Array.isArray(s.data().prompts)&&s.data().prompts.length){console.log("Loaded prompts from dives/"+id);return prep(s.data().prompts);}
    }catch(e){console.warn("Couldn't read dives/"+id+":",e.code||e.message);}
  }
  console.log("Using built-in prompts");
  return PROMPTS;
}
let played=false, promptsReady=null;
async function begin(u){
  if(begun===u.uid)return; begun=u.uid; user=u;
  const w=$("who"); w.innerHTML=""; w.append(el("span","",u.displayName||u.email.split("@")[0]));
  const out=el("button","px sm","Log out"); out.onclick=()=>signOut(auth); w.append(out);
  total=0;i=0;results=[];played=false;
  /* home screen: same scene, "Begin descent" instead of the login box */
  $("box").classList.add("hidden"); $("home").classList.remove("hidden"); $("auth").classList.remove("hidden");
  $("dive-no").textContent="Dive of "+today;
  promptsReady=loadPrompts();
  try{
    const snap=await getDoc(doc(db,"scores",`${today}_${u.uid}`));
    if(snap.exists()){const d=snap.data();total=d.score;results=d.results||[];played=true;$("go").innerHTML="&#9660; View today's result &#9660;";}
  }catch(e){console.warn("Couldn't check today's score:",e.code||e.message);}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* never wait more than 2.5s on Firestore for questions: fall back to the built-in set */
const racePrompts=()=>Promise.race([promptsReady||loadPrompts(),sleep(2500).then(()=>PROMPTS)]);
$("go").onclick=async()=>{
  $("auth").classList.add("hidden"); document.body.classList.add("in");
  if(played){PROMPTS=await racePrompts();sink();finish(false);return;}
  $("card").innerHTML=""; $("card").append(el("p","ds","descending…")); sink();
  const [ps]=await Promise.all([racePrompts(),sleep(1200)]);
  PROMPTS=ps; showPrompt();
};
onAuthStateChanged(auth,u=>{
  if(u)begin(u);
  else{begun=null;user=null;played=false;clearInterval(timer);$("who").innerHTML="";$("card").innerHTML="";document.body.classList.remove("in","res");home();$("home").classList.add("hidden");$("box").classList.remove("hidden");$("auth").classList.remove("hidden");}
});

/* ---------- Leaderboard ---------- */
onSnapshot(query(collection(db,"scores"),where("puzzleId","==",today)),snap=>{
  const rows=snap.docs.map(d=>d.data()).sort((a,b)=>b.score-a.score);
  const lb=$("lb"); lb.innerHTML="";
  if(!rows.length){lb.append(el("p","","No dives yet today. Be the first in the water."));return;}
  rows.forEach((r,k)=>{
    const d=el("div","row"+(user&&r.uid===user.uid?" me":""));
    d.append(el("span","",k+1),el("span","",r.user),el("em","",(r.score*10).toLocaleString()+" m"),el("strong","",r.score+" pts"));
    lb.append(d);
  });
},err=>{console.error(err);$("lb").textContent="Couldn't load scores ("+err.code+"). Check your Firestore rules.";});
onSnapshot(collection(db,"scores"),snap=>{
  const m={};
  snap.docs.forEach(d=>{const r=d.data(),k=r.uid||r.user,e=m[k]||(m[k]={k,user:r.user,total:0,dives:0});e.total+=r.score||0;e.dives++;});
  const rows=Object.values(m).sort((a,b)=>b.total-a.total), box=$("all"); box.innerHTML="";
  if(!rows.length){box.append(el("p","","No dives recorded yet."));return;}
  rows.forEach((r,k)=>{
    const d=el("div","row"+(user&&r.k===user.uid?" me":""));
    d.append(el("span","",k+1),el("span","",r.user),el("em","",r.dives+(r.dives===1?" dive":" dives")),el("strong","",r.total.toLocaleString()+" pts"));
    box.append(d);
  });
},err=>{console.error(err);$("all").textContent="Couldn't load scores ("+err.code+").";});
</script>
