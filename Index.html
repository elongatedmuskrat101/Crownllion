<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crownllion - Team Classifieds</title>
  <!-- Tailwind CSS CDN for instant styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">Crownllion</h1>
      <div id="user-section" class="flex items-center gap-3">
        <span id="user-email" class="text-sm opacity-90">Not logged in</span>
        <button id="auth-btn" class="bg-white text-indigo-600 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-slate-100 transition">
          Log In
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <!-- Left Column: Create Listing Form -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
      <h2 class="text-lg font-bold mb-4 text-slate-900">Post an Item</h2>
      <form id="post-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Title</label>
          <input type="text" id="post-title" required placeholder="e.g. Standing Desk Dual Monitor Arm" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Category</label>
          <select id="post-category" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
            <option value="Electronics">Electronics</option>
            <option value="Furniture">Furniture</option>
            <option value="Office Supplies">Office Supplies</option>
            <option value="Free / Giveaway">Free / Giveaway</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Price / Details</label>
          <input type="text" id="post-price" required placeholder="e.g. $50 or Free" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
          <textarea id="post-desc" rows="3" required placeholder="Brief description of the item..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition text-sm">
          Publish Listing
        </button>
      </form>
    </section>

    <!-- Right Column: Listings Feed -->
    <section class="md:col-span-2 space-y-4">
      <h2 class="text-lg font-bold text-slate-900">Recent Postings</h2>
      <div id="posts-feed" class="space-y-4">
        <p class="text-slate-500 text-sm">Loading postings...</p>
      </div>
    </section>

  </main>

  <!-- Firebase Scripts (Modular API) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Firebase Config Keys
    const firebaseConfig = {
      apiKey: "AIzaSyDtvXvvKSDW4w781kYm2e4lg47cC7Lx6NY",
      authDomain: "crownllion.firebaseapp.com",
      projectId: "crownllion",
      storageBucket: "crownllion.firebasestorage.app",
      messagingSenderId: "65215415079",
      appId: "1:65215415079:web:5558871761efd11e48df02",
      measurementId: "G-DT95Z9LZ22"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM Elements
    const authBtn = document.getElementById('auth-btn');
    const userEmailSpan = document.getElementById('user-email');
    const postForm = document.getElementById('post-form');
    const postsFeed = document.getElementById('posts-feed');

    let currentUser = null;

    // Authentication Listener
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        userEmailSpan.textContent = user.email;
        authBtn.textContent = 'Log Out';
      } else {
        userEmailSpan.textContent = 'Not logged in';
        authBtn.textContent = 'Log In with Google';
      }
    });

    // Handle Login/Logout
    authBtn.addEventListener('click', async () => {
      if (currentUser) {
        await signOut(auth);
      } else {
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          alert("Login failed: " + err.message);
        }
      }
    });

    // Handle Posting Items
    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) {
        alert("Please log in first to publish a post.");
        return;
      }

      const title = document.getElementById('post-title').value;
      const category = document.getElementById('post-category').value;
      const price = document.getElementById('post-price').value;
      const desc = document.getElementById('post-desc').value;

      try {
        await addDoc(collection(db, "posts"), {
          title,
          category,
          price,
          description: desc,
          author: currentUser.email,
          createdAt: serverTimestamp()
        });
        postForm.reset();
      } catch (err) {
        alert("Error creating post: " + err.message);
      }
    });

    // Realtime Listeners for Listings
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      postsFeed.innerHTML = "";
      if (snapshot.empty) {
        postsFeed.innerHTML = `<p class="text-slate-500 text-sm">No postings yet. Be the first to publish one!</p>`;
        return;
      }

      snapshot.forEach((doc) => {
        const item = doc.data();
        const postCard = document.createElement('div');
        postCard.className = "bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-2";
        postCard.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${item.category || 'General'}</span>
              <h3 class="font-bold text-slate-900 text-lg mt-1">${item.title}</h3>
            </div>
            <span class="font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg text-sm">${item.price}</span>
          </div>
          <p class="text-slate-600 text-sm">${item.description}</p>
          <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
            <span>Posted by: <strong class="text-slate-600">${item.author || 'Anonymous'}</strong></span>
          </div>
        `;
        postsFeed.appendChild(postCard);
      });
    });
  </script>
</body>
</html>
